version: '3.8'

services:
  backend:
    build:
      context: ./carevibe-backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/carevibe
      - SECRET_KEY=dev-secret-key-change-in-production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - FLASK_ENV=production
      - DEBUG=False
    depends_on:
      - mongo
    networks:
      - carevibe-network

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - carevibe-network

volumes:
  mongo_data:

networks:
  carevibe-network:
